name: Nx Affected

on:
  pull_request:
    paths:
      - "apps/**"
      - "libs/**"
      - "package.json"
      - "package-lock.json"
      - "nx.json"
      - "tsconfig.base.json"
      - ".github/workflows/nx-affected.yml"
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "libs/**"
      - "package.json"
      - "package-lock.json"
      - "nx.json"
      - "tsconfig.base.json"
      - ".github/workflows/nx-affected.yml"
  workflow_dispatch:

jobs:
  affected:
    name: Affected Checks
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite+pysqlite:///./check_api.db
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      SUPABASE_URL: http://localhost:54321
      SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      SUPABASE_STORAGE_BUCKET: videos
      WORKER_INVOKE_URL: http://worker.test/invoke/video-job
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements.txt -r apps/worker/requirements.txt

      - name: Determine Nx base and head
        id: shas
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.before }}" != "" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Show affected projects
        run: npx nx show projects --affected --base="${{ steps.shas.outputs.base }}" --head="${{ steps.shas.outputs.head }}"

      - name: Run affected web targets
        shell: bash
        run: |
          if npx nx show projects --affected \
            --base="${{ steps.shas.outputs.base }}" \
            --head="${{ steps.shas.outputs.head }}" | grep -qx "web"; then
            npx nx run-many \
              -t build,test,typecheck \
              -p web
          else
            echo "Web app not affected."
          fi

      - name: Check affected API app
        shell: bash
        run: |
          if npx nx show projects --affected --base="${{ steps.shas.outputs.base }}" --head="${{ steps.shas.outputs.head }}" | grep -qx "api"; then
            npm run check:api
            npm run test:api
          else
            echo "API app not affected."
          fi

      - name: Test affected worker app
        shell: bash
        run: |
          if npx nx show projects --affected --base="${{ steps.shas.outputs.base }}" --head="${{ steps.shas.outputs.head }}" | grep -qx "worker"; then
            cd apps/worker
            if [ -x .venv/bin/python ]; then
              .venv/bin/python -m pytest
            elif [ -x ../../venv/bin/python ]; then
              ../../venv/bin/python -m pytest
            else
              python3 -m pytest
            fi
          else
            echo "Worker app not affected."
          fi
