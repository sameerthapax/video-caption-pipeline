name: Terraform Apply

on:
  push:
    branches:
      - main
    paths:
      - "infra/aws/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-apply-development
  cancel-in-progress: false

jobs:
  apply:
    name: Apply
    runs-on: ubuntu-latest
    environment: development
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Validate backend configuration
        run: |
          test -n "${{ vars.TF_STATE_BUCKET }}"
          test -n "${{ vars.TF_STATE_LOCK_TABLE }}"

      - name: Write backend config
        run: |
          cat > backend.ci.hcl <<EOF
          bucket         = "${{ vars.TF_STATE_BUCKET }}"
          key            = "${{ vars.TF_STATE_KEY || 'video-caption-pipeline/dev/terraform.tfstate' }}"
          region         = "${{ vars.AWS_REGION || 'us-east-1' }}"
          encrypt        = true
          dynamodb_table = "${{ vars.TF_STATE_LOCK_TABLE }}"
          EOF

      - name: Terraform init
        run: terraform init -backend-config=backend.ci.hcl

      - name: Terraform apply
        run: terraform apply -auto-approve -input=false
