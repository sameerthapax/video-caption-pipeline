name: AWS Deploy

on:
  pull_request:
    paths:
      - "apps/**"
      - "libs/**"
      - "infra/aws/**"
      - "package.json"
      - "package-lock.json"
      - "nx.json"
      - "tsconfig.base.json"
      - ".github/workflows/aws-deploy.yml"
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "libs/**"
      - "infra/aws/**"
      - "package.json"
      - "package-lock.json"
      - "nx.json"
      - "tsconfig.base.json"
      - ".github/workflows/aws-deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: aws-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect affected projects
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.shas.outputs.base }}
      head: ${{ steps.shas.outputs.head }}
      web: ${{ steps.flags.outputs.web }}
      api: ${{ steps.flags.outputs.api }}
      worker: ${{ steps.flags.outputs.worker }}
      infra: ${{ steps.flags.outputs.infra }}
      terraform: ${{ steps.flags.outputs.terraform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Determine Nx base and head
        id: shas
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect affected projects
        id: flags
        shell: bash
        run: |
          AFFECTED="$(
            npx nx show projects \
              --affected \
              --base="${{ steps.shas.outputs.base }}" \
              --head="${{ steps.shas.outputs.head }}"
          )"

          echo "Affected projects:"
          echo "$AFFECTED"

          has_project() {
            echo "$AFFECTED" | grep -qx "$1"
          }

          if git diff --quiet "${{ steps.shas.outputs.base }}" "${{ steps.shas.outputs.head }}" -- infra/aws .github/workflows/aws-deploy.yml; then
            INFRA_CHANGED=false
            echo "infra=false" >> "$GITHUB_OUTPUT"
          else
            INFRA_CHANGED=true
            echo "infra=true" >> "$GITHUB_OUTPUT"
          fi

          if has_project web; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

          if has_project api; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
          fi

          if has_project worker; then
            echo "worker=true" >> "$GITHUB_OUTPUT"
          else
            echo "worker=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "$INFRA_CHANGED" = "true" ] || has_project web || has_project api || has_project worker; then
            echo "terraform=true" >> "$GITHUB_OUTPUT"
          else
            echo "terraform=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: Affected checks
    runs-on: ubuntu-latest
    needs: detect
    env:
      DATABASE_URL: sqlite+pysqlite:///./check_api.db
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      SUPABASE_URL: http://localhost:54321
      SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      SUPABASE_STORAGE_BUCKET: videos
      WORKER_INVOKE_URL: http://worker.test/invoke/video-job
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements.txt -r apps/worker/requirements.txt

      - name: Show affected projects
        run: |
          npx nx show projects \
            --affected \
            --base="${{ needs.detect.outputs.base }}" \
            --head="${{ needs.detect.outputs.head }}"

      - name: Run web checks
        if: needs.detect.outputs.web == 'true'
        run: npx nx run-many -t build,test,typecheck -p web

      - name: Run API checks
        if: needs.detect.outputs.api == 'true'
        run: |
          npm run check:api
          npm run test:api

      - name: Run worker tests
        if: needs.detect.outputs.worker == 'true'
        run: |
          cd apps/worker
          python -m pytest

  terraform-plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    needs:
      - detect
      - checks
    if: (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && needs.detect.outputs.terraform == 'true'
    environment: development
    env:
      TF_VAR_github_access_token: ${{ secrets.TF_VAR_GITHUB_ACCESS_TOKEN }}
      TF_VAR_worker_image_uri: ${{ vars.TF_VAR_WORKER_IMAGE_URI }}
      TF_VAR_allowed_frontend_origins: ${{ vars.TF_VAR_ALLOWED_FRONTEND_ORIGINS }}
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Validate backend configuration
        run: |
          test -n "${{ vars.TF_STATE_BUCKET }}"
          test -n "${{ vars.TF_STATE_LOCK_TABLE }}"

      - name: Write backend config
        run: |
          cat > backend.ci.hcl <<EOF
          bucket         = "${{ vars.TF_STATE_BUCKET }}"
          key            = "${{ vars.TF_STATE_KEY || 'video-caption-pipeline/dev/terraform.tfstate' }}"
          region         = "${{ vars.AWS_REGION || 'us-east-1' }}"
          encrypt        = true
          dynamodb_table = "${{ vars.TF_STATE_LOCK_TABLE }}"
          EOF

      - name: Terraform init
        run: terraform init -input=false -backend-config=backend.ci.hcl

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -no-color

  terraform-bootstrap:
    name: Terraform apply infrastructure
    runs-on: ubuntu-latest
    needs:
      - detect
      - checks
    if: ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && needs.detect.outputs.terraform == 'true'
    environment: development
    env:
      TF_VAR_github_access_token: ${{ secrets.TF_VAR_GITHUB_ACCESS_TOKEN }}
      TF_VAR_worker_image_uri: ${{ vars.TF_VAR_WORKER_IMAGE_URI }}
      TF_VAR_allowed_frontend_origins: ${{ vars.TF_VAR_ALLOWED_FRONTEND_ORIGINS }}
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Write backend config
        run: |
          cat > backend.ci.hcl <<EOF
          bucket         = "${{ vars.TF_STATE_BUCKET }}"
          key            = "${{ vars.TF_STATE_KEY || 'video-caption-pipeline/dev/terraform.tfstate' }}"
          region         = "${{ vars.AWS_REGION || 'us-east-1' }}"
          encrypt        = true
          dynamodb_table = "${{ vars.TF_STATE_LOCK_TABLE }}"
          EOF

      - name: Terraform init
        run: terraform init -input=false -backend-config=backend.ci.hcl

      - name: Terraform apply
        run: terraform apply -auto-approve -input=false

  build-images:
    name: Build and push images
    runs-on: ubuntu-latest
    needs:
      - detect
      - terraform-bootstrap
    if: ((((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))) && (needs.detect.outputs.api == 'true' || needs.detect.outputs.worker == 'true'))
    environment: development
    outputs:
      worker_image_uri: ${{ steps.meta.outputs.worker_image_uri }}
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Write backend config
        working-directory: infra/aws
        run: |
          cat > backend.ci.hcl <<EOF
          bucket         = "${{ vars.TF_STATE_BUCKET }}"
          key            = "${{ vars.TF_STATE_KEY || 'video-caption-pipeline/dev/terraform.tfstate' }}"
          region         = "${{ vars.AWS_REGION || 'us-east-1' }}"
          encrypt        = true
          dynamodb_table = "${{ vars.TF_STATE_LOCK_TABLE }}"
          EOF

      - name: Terraform init
        working-directory: infra/aws
        run: terraform init -input=false -backend-config=backend.ci.hcl

      - name: Resolve ECR repository URLs
        id: meta
        shell: bash
        run: |
          API_REPOSITORY_URL="$(terraform -chdir=infra/aws output -raw api_ecr_repository_url)"
          WORKER_REPOSITORY_URL="$(terraform -chdir=infra/aws output -raw worker_ecr_repository_url)"

          echo "api_repository_url=${API_REPOSITORY_URL}" >> "$GITHUB_OUTPUT"
          echo "worker_repository_url=${WORKER_REPOSITORY_URL}" >> "$GITHUB_OUTPUT"
          echo "worker_image_uri=${WORKER_REPOSITORY_URL}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        if: needs.detect.outputs.api == 'true'
        run: |
          docker build -f apps/api/Dockerfile -t "${{ steps.meta.outputs.api_repository_url }}:${IMAGE_TAG}" .
          docker push "${{ steps.meta.outputs.api_repository_url }}:${IMAGE_TAG}"

      - name: Build and push worker image
        if: needs.detect.outputs.worker == 'true'
        run: |
          docker build -f apps/worker/Dockerfile.lambda -t "${{ steps.meta.outputs.worker_repository_url }}:${IMAGE_TAG}" .
          docker push "${{ steps.meta.outputs.worker_repository_url }}:${IMAGE_TAG}"

  terraform-deploy:
    name: Terraform deploy worker image
    runs-on: ubuntu-latest
    needs:
      - detect
      - build-images
    if: ((((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))) && needs.detect.outputs.worker == 'true')
    environment: development
    env:
      TF_VAR_github_access_token: ${{ secrets.TF_VAR_GITHUB_ACCESS_TOKEN }}
      TF_VAR_worker_image_uri: ${{ needs.build-images.outputs.worker_image_uri }}
      TF_VAR_allowed_frontend_origins: ${{ vars.TF_VAR_ALLOWED_FRONTEND_ORIGINS }}
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Write backend config
        run: |
          cat > backend.ci.hcl <<EOF
          bucket         = "${{ vars.TF_STATE_BUCKET }}"
          key            = "${{ vars.TF_STATE_KEY || 'video-caption-pipeline/dev/terraform.tfstate' }}"
          region         = "${{ vars.AWS_REGION || 'us-east-1' }}"
          encrypt        = true
          dynamodb_table = "${{ vars.TF_STATE_LOCK_TABLE }}"
          EOF

      - name: Terraform init
        run: terraform init -input=false -backend-config=backend.ci.hcl

      - name: Terraform apply
        run: terraform apply -auto-approve -input=false
